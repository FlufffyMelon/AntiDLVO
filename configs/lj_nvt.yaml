# LJ units NVT example (single-component)
experiment:
  name: "lj_nvt_rho_${system.rho}_T_${simulation.temperature}"
  # name: "lj_nvt_test"
  results_dir: "results"
  description: "LJ fluid in NVT ensemble (LJ units)"

debug: false

simulation:
  ensemble: "NVT"
  temperature: 2.0         # LJ temperature
  n_steps: 1000

system:
  n_atoms: 512
  initial_capacity: 512
  rho: 0.6
  init:
    # mode: "random"        # options: random, uniform
    # min_distance: 1     # used in random mode
    mode: "uniform"
  box:
    - ${eval:"(${system.n_atoms} / ${system.rho})**(1/3)"}
    - ${eval:"(${system.n_atoms} / ${system.rho})**(1/3)"}
    - ${eval:"(${system.n_atoms} / ${system.rho})**(1/3)"}
  pbc: [true, true, true]

units:
  system: "lj"

types:
  LJ:
    name: "LJ"
    mass: 1.0
    charge: 0.0
    fraction: 1.0

pairs:
  - types: [LJ, LJ]
    forces:
      - {
        kind: LJ,
        sigma: 1,
        epsilon: 1,
        cutoff: 2.5
      }

sampler:
  actions:
    - action: "translate"
      probability: 1.0
  max_displacement: 0.1

logger:
  log_interval: 10
  xyz_interval: 200
