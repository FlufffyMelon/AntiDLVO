# LJ units muVT example with external wall potential (single-component)
experiment:
  # name: "lj_muVT_wall_h_${system.h}"
  name: "lj_muVT_wall_test"
  results_dir: "results"
  description: "LJ fluid in muVT ensemble under external wall potential (LJ units)"

debug: false

simulation:
  ensemble: "muVT"
  temperature: 1.2
  mu: -2.477
  n_steps: 1000

system:
  n_atoms: 128
  initial_capacity: 128
  init:
    # mode: "random"        # options: random, uniform
    # min_distance: 1     # used in random mode
    mode: "uniform"
    padding: [0.0, 0.0, 0.8]
  h: 2.8
  box:
    - 10
    - 10
    - ${system.h}
  pbc: [true, true, false]

units:
  system: "lj"

types:
  LJ:
    name: "LJ"
    mass: 1.0
    charge: 0.0
    fraction: 1.0

pairs:
  # Pairwise LJ interaction between the single type with standard cutoff
  - types: [LJ, LJ]
    forces:
      - {
        kind: LJ,
        sigma: 1,
        epsilon: 1,
        cutoff: 2.5
      }

one_body:
  - type: LJ
    forces:
      - { kind: wall, style: bottom }
      - { kind: wall, style: top }

sampler:
  actions:
    - action: "translate"
      probability: 0.7
    - action: "insert"
      probability: 0.15
    - action: "delete"
      probability: 0.15
  max_displacement: 0.1

  force_recompute: false

logger:
  log_interval: 10
  xyz_interval: 10


