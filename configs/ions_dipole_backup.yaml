# Test configuration with dipole molecules mixed with particles
experiment:
  name: "ions_dipole_1M_steps"
  # name: "ions_dipole_test"
  results_dir: "results"
  description: "Mixed system of ions and dipoles in NVT ensemble"

units:
  system: "standard"

simulation:
  ensemble: "NVT"
  temperature: 298 # K
  n_steps: 1000000

system:
  # n_atoms: 256  # This will be used for counts or fractions, actual atom count may differ
  initial_capacity: 4096
  init:
    mode: "random"
    min_distance: 0.31  # Increased to prevent overlaps
    padding: [0.0, 0.0, 0.31]  # Increased padding in all directions
  H: 5.0 # nm
  box:
    - 20
    - 20
    - ${system.H}
  pbc: [true, true, false]

ewald:
  alpha: 1.2
  real_cut: 1.4
  n_c: 3
  dielectric: 78.0
  z_scale_factor: 4.0
  dipole_correction: true

types:
  - Particle:
      type: "Na"
      mass: 39.0983 # amu
      charge: 1.0 # e
      count: ${eval:"0.602214076 * 0.05 * 400 * ${system.H}"}
  - Particle:
      type: "Cl"
      mass: 35.453 # amu
      charge: -1.0 # e
      count: ${eval:"0.602214076 * 0.05 * 400 * ${system.H}"}
  - Dipole:
      type_plus: "Ip"
      type_minus: "Im"
      type_ghost: "G"
      length: 0.4  # nm
      ghost_count: 2
      mass: 18.01528 # amu
      charge: 1 # e
      count: ${eval:"0.602214076 * 0.5 * 400 * ${system.H}"}

pairs:
  # ion-ion interactions
  - types: [Na, Na]
    forces:
      - kind: hard_sphere
        r1: 0.1
        r2: 0.1
      - kind: ewald

  - types: [Cl, Cl]
    forces:
      - kind: hard_sphere
        r1: 0.1
        r2: 0.1
      - kind: ewald

  - types: [Na, Cl]
    forces:
      - kind: hard_sphere
        r1: 0.1
        r2: 0.1
      - kind: ewald

  # ion-dipole interactions
  - types: ["(Na, Cl)", "(Ip, Im)"]
    forces:
      - kind: hard_sphere
        r1: 0.1
        r2: 0.1
      - kind: ewald

  - types: ["(Na, Cl)", "G"]
    forces:
      - kind: hard_sphere
        r1: 0.1
        r2: 0.1

  # dipole-dipole interactions
  - types: [Ip, Im]
    forces:
      - kind: hard_sphere
        r1: 0.1
        r2: 0.1
        exclude_intermol: true
      - kind: ewald

  - types: ["(Ip, Im)", "G"]
    forces:
      - kind: hard_sphere
        r1: 0.1
        r2: 0.1
        exclude_intermol: true

one_body:
  - type: "(Na, Cl, Ip, Im, G)"
    forces:
      - kind: hard_wall
        style: bottom
        r_wall: 0.1
      - kind: hard_wall
        style: top
        r_wall: 0.1
      - kind: electric_field
        voltage: 0.3  # V
        direction: up

sampler:
  actions:
    - action: "translate"
      probability: 1.0
  max_displacement: 0.05
  max_rotation: 30
  force_recompute: false

debug: false

logger:
  log_interval: 100
  xyz_interval: 100
