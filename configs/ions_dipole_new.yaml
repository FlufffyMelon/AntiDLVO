# Test configuration with dipole molecules mixed with particles
experiment:
  # name: "ions_dipole_disp_${sampler.max_displacement}_1M_steps"
  name: "ions_dipole_test"
  results_dir: "results"
  description: "Mixed system of ions and dipoles in NVT ensemble"

sigma: -0.04 # C/m^2

units:
  system: "standard"

simulation:
  ensemble: "NVT"
  temperature: 298 # K
  n_steps: 100000

system:
  # n_atoms: 256  # This will be used for counts or fractions, actual atom count may differ
  initial_capacity: 4096
  non_static_init:
    mode: "random"
    min_distance: 0.4  # Increased to prevent overlaps
    padding: [0.0, 0.0, 0.4]  # Increased padding in all directions
  static_init:
    mode: "uniform"
  H: 5.0 # nm
  box:
    - 20
    - 20
    - ${system.H}
  pbc: [true, true, false]

ewald:
  # Optimal Ewald parameters calculated based on desired accuracy (eps) and system properties
  eps: 1e-4
  real_cut: ${eval:"min(${system.box[0]}, ${system.box[1]}, ${system.H}) / 2.0 - 0.01"}
  alpha: ${eval:"sqrt(-log(${ewald.eps})) / ${ewald.real_cut}"}
  n_c: ${eval:"ceil(2 * sqrt(${ewald.alpha} * (-log(${ewald.eps}))) * min(${system.box[0]}, ${system.box[1]}, ${system.H}) / (2 * pi))"}

  dielectric: 78.0
  z_scale_factor: 4.0
  dipole_correction: true

types:
  - Particle:
      type: "Na"
      mass: 39.0983 # amu
      charge: 1.0 # e
      count: ${eval:"0.602214076 * 0.05 * 400 * ${system.H}"}
  - Particle:
      type: "Cl"
      mass: 35.453 # amu
      charge: -1.0 # e
      count: ${eval:"0.602214076 * 0.05 * 400 * ${system.H}"}
  - Dipole:
      type_plus: "Ip"
      type_minus: "Im"
      type_ghost: "G"
      length: 0.28  # nm
      ghost_count: 1
      mass: 18.01528 # amu
      charge: 0.75 # e
      count: ${eval:"0.602214076 * 0.5 * 400 * ${system.H}"}
  - Particle:
      type: "Wb"
      mass: 1.0 # amu
      charge: ${eval:"${sigma} * ${system.box[0]} * ${system.box[0]} / 256 / 0.1602"} # e
      z: 0.0 # nm
      count: 256
      static: true
  - Particle:
      type: "Wt"
      mass: 1.0 # amu
      charge: ${eval:"${sigma} * ${system.box[0]} * ${system.box[0]} / 256 / 0.1602"} # e # e
      z: ${system.H} # nm
      count: 256
      static: true


r_Na: 0.1
r_Cl: 0.18
r_IpmG: 0.15

pairs:
  # ion-ion interactions
  - types: [Na, Na]
    forces:
      - kind: hard_sphere
        r1: ${r_Na}
        r2: ${r_Na}
      - kind: ewald

  - types: [Cl, Cl]
    forces:
      - kind: hard_sphere
        r1: ${r_Cl}
        r2: ${r_Cl}
      - kind: ewald

  - types: [Na, Cl]
    forces:
      - kind: hard_sphere
        r1: ${r_Na}
        r2: ${r_Cl}
      - kind: ewald

  # ion-dipole interactions
  - types: ["Na", "(Ip, Im)"]
    forces:
      - kind: hard_sphere
        r1: ${r_Na}
        r2: ${r_IpmG}
      - kind: ewald

  - types: ["Cl", "(Ip, Im)"]
    forces:
      - kind: hard_sphere
        r1: ${r_Cl}
        r2: ${r_IpmG}
      - kind: ewald

  - types: ["Na", "G"]
    forces:
      - kind: hard_sphere
        r1: ${r_Na}
        r2: ${r_IpmG}

  - types: ["Cl", "G"]
    forces:
      - kind: hard_sphere
        r1: ${r_Cl}
        r2: ${r_IpmG}

  # dipole-dipole interactions
  - types: [Ip, Ip]
    forces:
      - kind: hard_sphere
        r1: ${r_IpmG}
        r2: ${r_IpmG}
      - kind: ewald

  - types: [Im, Im]
    forces:
      - kind: hard_sphere
        r1: ${r_IpmG}
        r2: ${r_IpmG}
      - kind: ewald

  - types: [Ip, Im]
    forces:
      - kind: hard_sphere
        r1: ${r_IpmG}
        r2: ${r_IpmG}
        exclude_intermol: true
      - kind: ewald

  - types: ["(Ip, Im, G)", "G"]
    forces:
      - kind: hard_sphere
        r1: ${r_IpmG}
        r2: ${r_IpmG}
        exclude_intermol: true

  # ion/dipole-wall interactions
  - types: ["(Na, Cl, Ip, Im)", "Wb"]
    forces:
      - kind: ewald

  - types: ["(Na, Cl, Ip, Im)", "Wt"]
    forces:
      - kind: ewald


one_body:
  - type: "Na"
    forces:
      - kind: hard_wall
        style: bottom
        r_wall: ${r_Na}
      - kind: hard_wall
        style: top
        r_wall: ${r_Na}

  - type: "Cl"
    forces:
      - kind: hard_wall
        style: bottom
        r_wall: ${r_Cl}
      - kind: hard_wall
        style: top
        r_wall: ${r_Cl}

  - type: "(Ip, Im, G)"
    forces:
      - kind: hard_wall
        style: bottom
        r_wall: ${r_IpmG}
      - kind: hard_wall
        style: top
        r_wall: ${r_IpmG}

sampler:
  actions:
    - action: "translate"
      probability: 1.0
  max_displacement: 1.0
  max_rotation: 180
  force_recompute: false

debug: false

logger:
  log_interval: 100
  xyz_interval: 100
